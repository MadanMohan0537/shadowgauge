[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowgauge"
version = "0.1.0"
description = "Local-first shadow evaluation with bias-aware sampling and drift alerts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
shadowgauge = "shadowgauge.cli:main"

[tool.setuptools.packages.find]
include = ["shadowgauge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
